[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavecore-x"
version = "0.1.0"
description = "Production-grade wireless communication simulation backend."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
ai = ["torch>=2.3.0", "onnxruntime>=1.18.0"]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wavecore*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]